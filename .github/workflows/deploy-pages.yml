name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Collect current Assembly data
        run: |
          collection_year=$(date -u +%Y)
          politics-tracker verify-api --era 22
          politics-tracker fetch-members --era 22
          politics-tracker fetch-minutes --era 22 --year "$collection_year"
          politics-tracker fetch-minutes --era 22 --year "$collection_year" \
            --venue-type assembly_committee
          politics-tracker classify-topics --backend rules
          politics-tracker extract-stances --backend rules
          politics-tracker detect-stance-changes

      - name: Build static site from the real-data store
        run: politics-tracker build-site --out site_out

      - name: Disable Jekyll processing
        run: touch site_out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
