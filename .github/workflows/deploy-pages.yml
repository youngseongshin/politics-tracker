name: Deploy GitHub Pages

on:
  workflow_dispatch:
  # M1 완료 후 아래 일일 배치를 활성화한다. 수집, 분류, 빌드 순서를 같은 잡에서 실행한다.
  # schedule:
  #   - cron: "17 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Require the real-data store
        run: |
          test -s data/store/people.jsonl || {
            echo "data/store/people.jsonl is missing. Complete M1 real-data collection before deployment."
            exit 1
          }

      - name: Build static site from the real-data store
        run: politics-tracker build-site --store data/store --out site_out

      - name: Disable Jekyll processing
        run: touch site_out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
