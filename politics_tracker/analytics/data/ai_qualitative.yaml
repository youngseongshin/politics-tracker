    summary: >-
      국방 AI는 유무인 복합체계, 드론, 표적 인식, 지휘통제의 핵심으로 제시됩니다.
      동시에 국방반도체의 높은 해외 의존과 기술 블록화가 안보 위험으로 지적됩니다.
      자동화된 전쟁이 폭력의 문턱을 낮출 수 있다는 반론도 등장합니다.
    discussions:
      - >-
        무기체계에 필요한 반도체와 AI 모델을 해외 공급망에 의존하면 수출통제나 분쟁
        때 작전 지속성과 보안이 흔들릴 수 있다는 우려가 있습니다.
      - >-
        AI·드론·로봇을 결합한 전장은 무기 수량보다 데이터, 지휘체계, 통신, 반도체,
        시험평가를 함께 갖춘 체계를 요구합니다.
      - >-
        군사 자동화가 억지력을 높일 수 있다는 주장과 함께 판단 속도를 높여 오판과
        확전을 키우고 폭력의 실행 비용을 낮출 수 있다는 문제 제기가 있습니다.
    tensions:
      - "첨단전력의 신속한 확보와 인간의 통제·오판 방지·국제규범을 마련해야 한다는 요구의 긴장"
      - "동맹과 글로벌 공급망 활용의 효율성과 국방 핵심부품·모델의 자립 필요성 사이의 긴장"
    implication: >-
      국방 AI 전략은 국산화율뿐 아니라 인간 승인 절차, 시험평가, 공급 중단 대응,
      민간 기술의 군사 전용 기준을 함께 공개해야 합니다.
    open_question: "AI가 표적과 대응을 추천하거나 실행할 때 인간은 어느 단계에서 결정을 멈출 수 있습니까?"
    evidence:
      - utterance_id: "utt_20260324_6ec72c0c_0124"
        focus: "98.9%가 해외에 의존"
        note: "어윤성 진술인은 무기체계를 구성하는 다양한 반도체의 해외 의존이 국방 AI의 기반 위험이라고 설명했습니다."
      - utterance_id: "utt_20260520_7fcb0f27_0130"
        focus: "폭력의 인프라"
        note: "차지호 의원은 AI와 로봇이 폭력 실행의 기반을 넓혀 전쟁 위험을 바꿀 수 있다고 지적했습니다."
      - utterance_id: "utt_20260706_9d25c557_0003"
        focus: "단순히 무기를 늘리는 차원이 아니라"
        note: "김성회 의원은 AI 전쟁 대비를 무기 수량이 아니라 지휘·데이터·무인체계의 결합 문제로 설명했습니다."

cross_cutting:
  - title: "속도와 보호 장치"
    summary: >-
      데이터센터, 개인정보 특례, 조달, 국방에서 빠른 도입이 요구되지만 피해와 비용을
      되돌리기 어려운 분야일수록 사전 심사와 중단 기준이 더 구체적이어야 합니다.
  - title: "목표와 집행"
    summary: >-
      ‘3강’, ‘대전환’, ‘허브’ 같은 목표는 널리 공유되지만 이용자, 담당 부처, 운영비,
      데이터 보안, 공식정보 공개 방식, 성과 기준이 빠진 사업은 현장에서 작동하지
      않을 수 있습니다.
  - title: "공공투자와 비용 배분"
    summary: >-
      국가가 인프라와 기업 전환에 투자할수록 전기요금, 물, 지역 부지, 창작 데이터,
      노동 전환 비용을 누가 부담하고 편익을 누가 얻는지 함께 공개해야 합니다.
  - title: "데이터 접근과 권리"
    summary: >-
      고품질 데이터는 산업과 공공서비스의 조건이지만 개인정보와 저작물을 예외적으로
      이용할 때 정보주체와 창작자가 거부·감사·보상받을 방법이 필요합니다.
  - title: "자동화와 인간 책임"
    summary: >-
      의료, 행정·특허 심사, 교육 평가, 치안, 콘텐츠 삭제, 국방에서 AI가 판단을
      돕더라도 오류를 설명하고 멈추고 다시 판단할 책임은 구체적인 사람과 기관에
      남아야 합니다.
  - title: "글로벌 협력과 주권"
    summary: >-
      해외 모델·GPU·투자는 성장에 필요하지만 평가 능력, 공급 중단 대응, 국내 대안이
      없으면 협력이 종속으로 바뀔 수 있습니다.

open_questions:
  - "AI 사업의 성공과 실패를 가르는 공개 지표는 무엇이며 누가 독립적으로 검증합니까?"
  - "전력·물·데이터·저작물·노동 전환처럼 사업 밖으로 밀려나는 비용을 누가 계산합니까?"
  - "자동화된 공공 판단과 콘텐츠 차단에 대해 시민이 설명과 사람의 재검토를 요구할 수 있습니까?"
  - "원본 개인정보나 창작물이 학습된 뒤 위법·오류가 확인될 때 어떤 구제 수단이 작동합니까?"
  - "지역과 중소기업이 인프라 제공자가 아니라 생산성·고용·수익의 수혜자가 되는 조건은 무엇입니까?"
  - "AI 서·논술형 채점과 특허 심사에서 사람의 재검토와 이의제기는 어떻게 보장됩니까?"
  - "정부의 공식 정책자료를 AI가 2차 기사보다 먼저, 출처와 함께 읽을 수 있습니까?"
  - "국방·행정의 고위험 AI에서 인간이 최종 결정을 보류하거나 중단하는 절차가 명시돼 있습니까?"

caveats:
  - >-
    분석 범위는 국회 회의록에서 AI, 인공지능, ChatGPT, LLM, 딥페이크 등 직접 표현이
    탐지된 발언입니다. AI를 직접 말하지 않은 관련 논의는 포함되지 않을 수 있습니다.
  - >-
    논점은 발언 수를 세거나 키워드 점수로 정하지 않았습니다. 2026년 1월 15일부터
    8월 12일까지 탐지된 AI 표현의 원문 문맥을 모두 읽고, 반복된 정책 선택과 반론을
    정성적으로 묶었습니다.
  - >-
    근거 발언은 각 논점을 대표하는 사례이며 발언자의 주장에 대한 사실 판정이 아닙니다.
    원문 문맥과 회의록 출처를 함께 확인할 수 있습니다.
  - >-
    8월은 12일까지의 일부 자료입니다. 이후 회의록이 추가되면 새로운 논점과 반론을
    반영해 보고서 버전을 갱신합니다.
