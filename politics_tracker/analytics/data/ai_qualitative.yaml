  - key: "delivery_governance"
    eyebrow: "집행과 거버넌스"
    title: "큰 전략보다 구매·보안·부처 책임의 빈틈이 성과를 막습니다"
    summary: >-
      예산과 전략이 발표된 뒤 국회 질의는 실제 이용자, 구축 기간, 데이터 보안,
      담당 부처, 공공정보 접근성, 위기 대응 연락망으로 이동합니다. AI라는 이름을 붙인
      사업이 기존 사업과 무엇이 다른지, 결과를 누가 점검하는지가 반복적으로 제기됩니다.
    discussions:
      - >-
        정부가 구매한 서비스에 이용자가 거의 없거나 사업 기간 안에 시스템 구축이
        불가능한 사례는 조달 이전의 수요 검증이 약하다는 문제를 보여 줍니다.
      - >-
        API와 데이터 접근권한이 비공식적으로 열려 있으면 좋은 모델을 도입해도 공공기관
        보안과 개인정보 보호가 무너질 수 있습니다.
      - >-
        피지컬 AI, 데이터센터, 국제 투자처럼 여러 부처가 얽힌 사업에서는 총괄 조직이
        연락과 위험 관리까지 실제로 수행하는지가 성과의 조건입니다.
      - >-
        정부 홈페이지가 검색·수집을 막아 AI가 기사 같은 2차 자료만 보여 주면 국민과
        기업이 공식 정책을 부정확하게 접할 수 있다는 새로운 공개 방식의 문제가 제기됐습니다.
    tensions:
      - "선도 사례를 빨리 만들려는 압력과 수요·보안·운영비를 먼저 검증해야 한다는 요구의 긴장"
      - "범부처 전략의 명칭과 실제 의사결정 책임이 일치하지 않는 문제"
    implication: >-
      사업 승인 전에 이용자, 데이터 흐름, 책임 부처, 운영비, 실패 중단 기준을 공개하고
      공식 정책자료를 기계가 정확히 읽을 수 있게 제공해야 성과 없는 도입과 오정보를
      함께 줄일 수 있습니다.
    open_question: "각 AI 사업에는 책임 부처와 중단 기준이 있으며 공식 정보는 AI가 출처와 함께 읽을 수 있습니까?"
    evidence:
      - utterance_id: "utt_20260729_9beb8c79_0091"
        focus: "유료 가입자가 3명"
        note: "이해민 의원은 공공기관이 구매한 AI 서비스의 실제 이용자가 극히 적은 사례를 들어 수요 검증을 물었습니다."
      - utterance_id: "utt_20260402_59c89bc1_0005"
        focus: "단년도에 수요기업의 전사적 AX를 수행할 수 있는지를 현실적으로 고려"
        note: "이복우 수석전문위원은 짧은 사업 기간에 기업 전체의 전환을 수행할 수 있는지 검토해야 한다고 보고했습니다."
      - utterance_id: "utt_20260311_fd3dded8_0051"
        focus: "워킹그룹 소속 기업들에게 연락조차 취한 적이 없다"
        note: "황정아 의원은 국제분쟁 뒤에도 AI 전략기구가 투자기업과 연락하지 않은 점을 위험 관리의 공백으로 지적했습니다."
      - utterance_id: "utt_20260625_2b462585_1110"
        focus: "비공식적으로 열려 있는 부분에 API가 있었는데"
        note: "한성숙 후보자는 AI 솔루션 업체가 비공식 API를 통해 공개된 합격자 명단에 접근했던 보안 문제를 설명했습니다."
      - utterance_id: "utt_20260812_4f9c01e8_1128"
        focus: "피지컬 AI의 대한민국 공식 주무부처는 과기부입니다"
        note: "김종민 의원은 피지컬 AI와 휴머노이드의 담당 부처가 갈려 현장 집행과 투자 책임이 불명확하다고 지적했습니다."
      - utterance_id: "utt_20260812_4f9c01e8_1170"
        focus: "정부의 직접 자료를 검색해서"
        note: "장철민 의원은 일부 공공기관 자료를 AI가 직접 읽지 못해 국민이 2차 자료에 의존하는 문제를 제기했습니다."

  - key: "privacy_rights"
    eyebrow: "개인정보와 권리"
    title: "학습에 쓴 원본 개인정보는 문제가 생겨도 되돌리기 어렵습니다"
    summary: >-
      AI 개발에 원본 개인정보를 예외적으로 쓰게 하는 법안은 공익과 혁신을 근거로
      제시됩니다. 반대 측은 한 번 학습된 정보는 회수하기 어렵고 정보주체가 실제로
      통제하기 힘들다고 지적합니다. 스마트글라스처럼 새 기기가 만드는 침해도 논의됩니다.
    discussions:
      - >-
        익명·가명 정보로 개발하기 어려운 경우에 한해 사전 심의와 안전장치를 두자는
        방안이 제시됐습니다.
      - >-
        사전 심의가 있더라도 대규모 유출이나 목적 외 사용이 발생하면 이미 학습된
        데이터를 삭제할 수 있는지, 피해를 어떻게 입증할지가 남습니다.
      - >-
        웨어러블 기기는 주변 사람의 얼굴과 행동까지 수집할 수 있어 이용자 동의만으로
        해결되지 않는 프라이버시 원칙이 필요합니다.
    tensions:
      - "공익적 AI 개발을 위한 데이터 접근과 정보주체의 통제권 사이의 긴장"
      - "사전 심의 중심 제도와 학습 이후의 회수·감사·구제 필요성 사이의 간극"
    implication: >-
      예외를 허용한다면 데이터 항목과 이용기간, 모델 반영 범위, 사후 감사, 삭제가
      불가능할 때의 구제 방안을 사전 심의 결과와 함께 공개해야 합니다.
    open_question: "원본 개인정보가 학습된 뒤 위법 사용이 확인되면 모델과 피해를 어떻게 되돌립니까?"
    evidence:
      - utterance_id: "utt_20260514_f03b7fcf_0016"
        focus: "학습이 끝났으면 이것은 사후에 어떻게 거둬들일 수도 없는"
        note: "신장식 의원은 개인정보 특례의 가장 큰 위험으로 학습 이후 회수 불가능성을 들었습니다."
      - utterance_id: "utt_20260729_3a39009f_0564"
        focus: "식별 가능한 원본 개인정보를 인공지능 기술개발을 위해서 예외적으로 쓸 수 있게"
        note: "손솔 의원은 원본 개인정보 이용 특례가 권리 보장과 충돌한다고 우려했습니다."
      - utterance_id: "utt_20260729_3a39009f_0567"
        focus: "개인정보 보호 법익과 그리고 AI 개발을 통해서 개인들이 얻을 수 있는 편익"
        note: "송경희 위원장은 제한된 요건, 안전장치, 위원회 심의로 권리와 편익의 균형을 맞추겠다고 답했습니다."
      - utterance_id: "utt_20260728_d80154c0_0093"
        focus: "스마트글라스"
        note: "송경희 위원장은 스마트글라스를 당장의 신기술 프라이버시 위협으로 지목하고 처리 원칙을 마련하겠다고 밝혔습니다."

  - key: "copyright_creators"
    eyebrow: "저작권과 창작 생태계"
    title: "학습 허용만으로는 AI 대량 창작물의 유통 문제를 해결할 수 없습니다"
    summary: >-
      저작물 학습의 공정이용과 텍스트·데이터 마이닝 면책은 연구와 산업에 기회를 줄 수
      있습니다. 그러나 대량 생성된 책·음악·영상이 유통과 납본, 수익 배분을 바꾸는
      문제는 별도의 정책 체계를 요구합니다.
    discussions:
      - >-
        학습 단계에서는 권리자가 기계 판독 방식으로 이용 거부 의사를 표시하게 하고
        연구개발과 창작자 권리를 조화시키자는 입법 검토가 진행됩니다.
      - >-
        생성 이후에는 한 사람이 수천 권이나 대량 음원을 만들 수 있어 플랫폼 품질,
        국립도서관 납본, 소비자 표시, 창작자 보상 문제가 생깁니다.
      - >-
        문화 분야의 AI 지원은 제작 기회를 넓힐 수 있지만 데이터와 플랫폼을 가진
        사업자에게 수익이 집중되지 않도록 권리와 보상 구조를 함께 설계해야 합니다.
    tensions:
      - "연구·산업의 학습 접근성을 높이는 정책과 창작자의 허락·보상 권리를 보장하는 정책의 긴장"
      - "생성 도구의 진입장벽 완화와 대량 저품질 콘텐츠가 유통 생태계를 잠식할 위험의 긴장"
    implication: >-
      학습 단계의 예외와 생성물 유통 규칙을 분리해 다뤄야 합니다. 출처 표시, 이용 거부,
      보상, AI 생성물 표시와 납본 기준을 하나의 창작 생태계 정책으로 연결할 필요가 있습니다.
    open_question: "창작자가 학습을 거부하거나 보상받는 방법과 AI 대량 생성물의 유통 책임은 무엇입니까?"
    evidence:
      - utterance_id: "utt_20260304_c3a5b78c_0112"
        focus: "AI 기반 자동출판 구조"
        note: "김재원 의원은 자동출판과 대량 음원 생성이 창작·유통 전반을 재편한다고 지적했습니다."
      - utterance_id: "utt_20260309_6470566f_0031"
        focus: "TDM 면책제도"
        note: "성소미 전문위원은 텍스트·데이터 마이닝 면책과 권리자의 이용 거부 표시를 함께 검토했습니다."
      - utterance_id: "utt_20260407_b692a65c_0926"
        focus: "AI 콘텐츠, 가상현실 제작, 저작권 및 플랫폼 기술"
        note: "김재원 의원은 문화기술 지원이 제작뿐 아니라 저작권과 플랫폼 기술까지 포괄하는지 점검했습니다."
      - utterance_id: "utt_20260304_c3a5b78c_0115"
        focus: "AI로 인해서 찍어 내는 그런 책들은"
        note: "최휘영 장관은 대량 생성 책을 납본에서 제외할 근거와 모니터링을 마련하겠다고 답했습니다."

  - key: "industrial_intellectual_property"
    eyebrow: "특허와 산업 지식재산"
    title: "AI 시대의 지식재산 정책은 빠른 권리화와 심사 품질을 함께 요구합니다"
    summary: >-
      AI·반도체·피지컬 AI의 기술 변화가 빨라지면서 특허를 늦게 심사하면 기업이 시장을
      놓칠 수 있다는 우려가 커졌습니다. 반면 우선심사만 서두르면 광범위한 선행기술을
      놓치거나 권리범위를 잘못 판단할 수 있어 심사 인력과 품질 관리가 함께 논의됩니다.
    discussions:
      - >-
        전략산업과 청년 창업자의 특허를 한 달 안에 심사하는 초고속 절차가 제시됐지만,
        기간 단축이 부실 심사나 과도한 권리 부여로 이어지지 않는지 확인할 지표가 필요합니다.
      - >-
        특허 데이터로 피지컬 AI의 전략지도를 만들고 표준·원천특허 연구개발 방향을
        제시해 기업의 기술 개발과 해외 진출을 돕겠다는 산업정책이 추진됩니다.
      - >-
        선행기술 검색·번역·위조상품 탐지 같은 지식재산 행정에도 AI를 쓰려 하지만,
        심사 인력 확충과 오류 검토 없이 자동화만으로 처리량과 품질을 함께 높이기는 어렵습니다.
    tensions:
      - "시장 선점을 위한 초고속 권리화와 정확한 선행기술 조사·권리범위 판단 사이의 긴장"
      - "AI가 심사와 단속의 처리량을 높일 가능성과 오류를 최종 검토할 전문인력이 필요한 현실의 긴장"
    implication: >-
      초고속 심사는 처리기간뿐 아니라 취소·무효·정정 비율과 심사 품질을 함께 공개해야
      합니다. AI 특허지도와 자동 검색도 기업 지원 자료와 심사 판단을 구분해 운영할
      필요가 있습니다.
    open_question: "빠르게 등록된 AI 특허의 품질과 권리범위 오류를 누가 어떤 지표로 점검합니까?"
    evidence:
      - utterance_id: "utt_20260812_4f9c01e8_0827"
        focus: "심사 속도를 높이는 과정에서 부실 심사나 권리범위 판단에 오류가 발생하지 않도록"
        note: "박희승 의원은 AI 특허 심사기간 단축과 심사 정확성·품질을 함께 달성하는지 물었습니다."
